<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>音乐</title>
<!-- 云朵音符 favicon，与页面同款晨雾蓝渐变 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238FBEE3'/%3E%3Cstop offset='1' stop-color='%235B9BD5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23F0F6FB'/%3E%3Cg fill='url(%23g)'%3E%3Ccircle cx='20' cy='38' r='11'/%3E%3Ccircle cx='33' cy='30' r='14'/%3E%3Ccircle cx='45' cy='39' r='10'/%3E%3Crect x='12' y='36' width='43' height='13' rx='6.5'/%3E%3C/g%3E%3Cg fill='%23ffffff'%3E%3Cellipse cx='27' cy='41' rx='4.5' ry='3.5'/%3E%3Crect x='30.2' y='27' width='2.4' height='14' rx='1.2'/%3E%3Cpath d='M30.2 27q7 1.5 7 7.5l-2.6.8q0-5.5-4.4-6.3z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 300;
    background: linear-gradient(180deg, #E8F0F8 0%, #F7FAFD 60%, #FFFFFF 100%);
    background-attachment: fixed;
    color: #2D3E50;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 3rem 1.2rem;
  }

  .wrap { width:100%; max-width:400px; }

  /* ── 歌曲信息 ── */
  .info { text-align:center; margin: 1rem 0 2rem; }
  .title {
    font-size:1.35rem; font-weight:500; letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .artist {
    font-size:.85rem; color:#8CA3B8; margin-top:.4rem; letter-spacing:.05em;
    max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ── 进度条 ── */
  .progress { display:flex; align-items:center; gap:.7rem; margin:1.5rem 0; }
  .time { font-size:.7rem; color:#9BB0C4; width:2.6rem; text-align:center; }
  input[type=range] {
    flex:1; -webkit-appearance:none; appearance:none;
    height:3px; border-radius:3px; cursor:pointer;
    background: linear-gradient(90deg, #9CC3E5 var(--p,0%), #D8E4EF var(--p,0%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:#5B9BD5; border:2.5px solid #fff;
    box-shadow: 0 1px 5px rgba(91,155,213,.4);
  }
  input[type=range]::-moz-range-thumb {
    width:13px; height:13px; border-radius:50%;
    background:#5B9BD5; border:2.5px solid #fff;
    box-shadow: 0 1px 5px rgba(91,155,213,.4);
  }

  /* ── 控制按钮 ── */
  .ctrl { display:flex; justify-content:center; align-items:center; gap:3rem; margin:1.8rem 0 2.5rem; }
  button {
    background:none; border:none; cursor:pointer;
    color:#5B7A99; padding:.4rem;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, color .15s ease;
  }
  button svg { width:1.5rem; height:1.5rem; fill:currentColor; }
  button:active { transform:scale(.88); color:#5B9BD5; }

  .play {
    width:64px; height:64px;
    border-radius:50%;
    color:#fff;
    background: linear-gradient(145deg, #8FBEE3, #5B9BD5);
    box-shadow: 0 6px 18px rgba(91,155,213,.35);
    transition: transform .2s ease, box-shadow .2s ease;
    animation: float 4s ease-in-out infinite;
  }
  .play svg { width:1.7rem; height:1.7rem; }
  .play:active { transform:scale(.92); box-shadow: 0 3px 10px rgba(91,155,213,.3); }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-3px); }
  }

  /* ── 歌曲列表 ── */
  ul { list-style:none; }
  li {
    padding:.75rem .9rem; margin:.15rem 0;
    border-radius:14px;
    display:flex; align-items:center; gap:.7rem;
    cursor:pointer; font-size:.9rem; color:#6B8299;
    transition: background .2s ease, transform .2s ease, color .2s;
  }
  li:hover { background: rgba(255,255,255,.6); }
  li.on {
    background: rgba(255,255,255,.85);
    box-shadow: 0 3px 12px rgba(91,155,213,.15);
    color:#2D3E50; font-weight:400;
    transform: translateY(-1px);
  }
  li .t {
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  li .a {
    font-size:.75rem; color:#A9BCCD;
    flex-shrink:0; max-width:40%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  li.on .a { color:#5B9BD5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="info">
    <div class="title" id="t">加载中…</div>
    <div class="artist" id="a"></div>
  </div>

  <div class="progress">
    <span class="time" id="ct">0:00</span>
    <input type="range" id="bar" min="0" max="100" step="0.1" value="0">
    <span class="time" id="dt">0:00</span>
  </div>

  <div class="ctrl">
    <button id="prev" aria-label="上一首">
      <svg viewBox="0 0 24 24"><path d="M6 5h2.2v14H6zM20 5v14L9.5 12z"/></svg>
    </button>
    <button class="play" id="pp" aria-label="播放"></button>
    <button id="next" aria-label="下一首">
      <svg viewBox="0 0 24 24"><path d="M15.8 5H18v14h-2.2zM4 5v14l10.5-7z"/></svg>
    </button>
  </div>

  <ul id="list"></ul>
</div>

<script>
const audio = new Audio();
let list = [], idx = -1;

/* SVG 图标：播放 / 暂停 */
const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>';

const $ = id => document.getElementById(id);
const fmt = s => isNaN(s) ? '0:00' : `${s/60|0}:${String(s%60|0).padStart(2,'0')}`;

async function init() {
  $('pp').innerHTML = ICON_PLAY;
  try {
    list = await (await fetch('music_library.json')).json();
  } catch { $('t').textContent = '歌单加载失败'; return; }
  render();
  const saved = +localStorage.getItem('idx') || 0;
  load(Math.min(saved, list.length - 1));
}

function render() {
  $('list').innerHTML = '';
  list.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="t">${s.title}</span><span class="a">${s.artist}</span>`;
    li.onclick = () => load(i, true);
    $('list').appendChild(li);
  });
}

function load(i, play) {
  idx = i;
  audio.src = 'songs/' + list[i].fileName;
  audio.load();
  $('t').textContent = list[i].title;
  $('a').textContent = list[i].artist;
  $('bar').value = 0; $('bar').style.setProperty('--p','0%');
  $('ct').textContent = '0:00'; $('dt').textContent = '0:00';
  [...$('list').children].forEach((li,n)=>li.classList.toggle('on', n===i));
  localStorage.setItem('idx', i);
  if (play) playAudio();
}

function playAudio() {
  audio.play().then(() => $('pp').innerHTML = ICON_PAUSE)
             .catch(() => $('pp').innerHTML = ICON_PLAY);
}

$('pp').onclick = () => {
  if (audio.paused) { playAudio(); } else { audio.pause(); $('pp').innerHTML = ICON_PLAY; }
};
$('next').onclick = () => load((idx+1) % list.length, true);
$('prev').onclick = () => {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  load((idx-1+list.length) % list.length, true);
};

$('bar').oninput = e => {
  $('ct').textContent = fmt(e.target.value/100 * audio.duration);
  $('bar').style.setProperty('--p', e.target.value + '%');
};
$('bar').onchange = e => {
  audio.currentTime = e.target.value/100 * audio.duration;
};

audio.ontimeupdate = () => {
  if (!audio.duration) return;
  const p = audio.currentTime / audio.duration * 100;
  $('bar').value = p;
  $('bar').style.setProperty('--p', p + '%');
  $('ct').textContent = fmt(audio.currentTime);
};
audio.onloadedmetadata = () => $('dt').textContent = fmt(audio.duration);
audio.onended = () => load((idx+1) % list.length, true);

init();
</script>
</body>
</html>
